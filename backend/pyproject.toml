[project]
name = "curiosity-engine-backend"
version = "0.1.0"
description = "FastAPI backend for Infinite Curiosity Engine with Cerebras inference, Mistral batch warming, and edge media caching"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "redis>=5.2.0",
    "sse-starlette>=2.1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
