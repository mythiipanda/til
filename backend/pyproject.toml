[project]
name = "tdilearned-backend"
version = "0.1.0"
description = "TDILEARNED FastAPI backend with Cerebras inference, Mistral batch warming, and edge media caching"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "tavily-python>=0.7.27",
    "ddgs>=9.14.4",
    "feedparser>=6.0.11",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.run]
# Operational CLI utilities (agent_cli, signal_collector, bulk_precompute, ...)
# are not part of the served API surface; exclude them from the coverage gate.
omit = ["app/scripts/*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# The codebase deliberately uses broad exception handling for resilience across
# network/LLM calls and a best-effort Windows stdout guard.
ignore = ["BLE001", "S110"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
