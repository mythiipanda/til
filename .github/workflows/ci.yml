name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    name: Backend (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: uv sync --group dev
      - name: Lint
        run: uv run ruff check app tests
      - name: Type check
        run: uv run mypy app
      - name: Tests
        run: uv run pytest -q
      - name: Verify requirements in sync
        run: |
          uv export --no-dev --no-hashes --no-emit-project -o /tmp/requirements.txt
          # Normalize before diffing: drop ALL comment lines (uv >=0.12 emits indented
          # "# via ..." provenance), drop env markers (formatting varies by uv/platform), sort.
          # Pin drift (pkg==version) still fails the check, which is what Azure Oryx installs depend on.
          norm() { sed '/^[[:space:]]*#/d' "$1" | sed 's/[[:space:]]*;.*$//' | sort; }
          diff <(norm requirements.txt) <(norm /tmp/requirements.txt)

  frontend:
    name: Frontend (typecheck + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Tests
        run: npx vitest run